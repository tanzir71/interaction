<script>
// Fetch catalog data alongside the shell scripts, with one response for startup.
window.intrxCatalogRequest=fetch('registry/index.json',{cache:'no-cache'});
window.intrxCatalogRequest.catch(()=>{});
// Reserve route chrome before the catalog loads, including legacy entry links.
const entryHash=location.hash;
document.documentElement.dataset.route=entryHash.startsWith('#/')?(entryHash.split('/')[1]||'home'):entryHash.startsWith('#cat-')?'library':/^#(?!top$)[a-z0-9-]+$/.test(entryHash)?'c':'home';
// Direct detail links need the demo UI font before the lazy module arrives.
if (/^#\/c\/|^#(?!\/|cat-|top)[a-z0-9-]+$/.test(location.hash)) {
  const font=document.createElement('link');font.rel='preload';font.as='font';font.type='font/woff2';font.crossOrigin='anonymous';font.href='assets/fonts/inter-latin-variable.woff2';document.head.appendChild(font);
}
</script>
