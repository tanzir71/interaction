name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/intrx/package-lock.json
      - name: Verify registry, stages, motion and runtime
        run: |
          node tools/verify-registry.js
          node tools/verify-stage.js
          node tools/verify-motion.js
          node tools/build-registry.js --check
          node --test tools/runtime.test.js
      - name: Verify CLI and MCP
        run: |
          npm ci --prefix packages/intrx --no-fund --no-audit
          npm test --prefix packages/intrx

  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Stage public static files
        run: node tools/prepare-site.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
